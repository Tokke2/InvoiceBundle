<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fakturabunten: en bunt fakturor med guldband och bock.
       Reservikon (vektor) — huvudikonerna är app_icon.png/.ico. -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="#16305a"/>
  <!-- bakre ark -->
  <g fill="#dfe9f7">
    <rect x="96" y="128" width="216" height="272" rx="18" transform="rotate(-8 204 264)"/>
    <rect x="128" y="112" width="216" height="272" rx="18" transform="rotate(-4 236 248)"/>
  </g>
  <!-- främre faktura -->
  <g>
    <path d="M176 104 h168 l56 56 v216 a24 24 0 0 1 -24 24 H176 a24 24 0 0 1 -24 -24 V128 a24 24 0 0 1 24 -24 z" fill="#ffffff"/>
    <path d="M344 104 l56 56 h-56 z" fill="#b9cde8"/>
    <g fill="#8fa9cc">
      <rect x="188" y="196" width="176" height="20" rx="10"/>
      <rect x="188" y="240" width="192" height="20" rx="10"/>
      <rect x="188" y="284" width="192" height="20" rx="10"/>
      <rect x="188" y="328" width="112" height="20" rx="10"/>
    </g>
  </g>
  <!-- guldband runt bunten -->
  <path d="M104 316 L424 276 L424 348 L104 388 Z" fill="#e8a91c"/>
  <!-- bock-badge -->
  <circle cx="384" cy="368" r="62" fill="#f2b705" stroke="#12315e" stroke-width="10"/>
  <path d="M348 368 l26 26 l46 -50" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
