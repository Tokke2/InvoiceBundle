name: Release integrity

# Vaktar att autouppdateringen aldrig försvinner ur den publicerade
# versionen igen: uppdaterarfiler, Hjälp-menyns "Sök ny version",
# tray-valet, auto-kollen vid start och release-manifestet testas
# vid varje push och tagg.

on:
  push:
    branches:
      - "arena/**"
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  updater-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Guard the auto-updater
        run: >-
          python -m pytest
          tests/test_updater.py
          tests/test_release_integrity.py
          -q

  build-release-package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the versioned program package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_PATH="${RUNNER_TEMP}/InvoiceBundle-v${VERSION}.zip"
          python build_release.py \
            --root . \
            --out "$PACKAGE_PATH" \
            --version "$VERSION" \
            --sha "$(git rev-parse HEAD)"
      - name: Attach package to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "${RUNNER_TEMP}/InvoiceBundle-v${VERSION}.zip" \
            --clobber
