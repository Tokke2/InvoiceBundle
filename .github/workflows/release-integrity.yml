name: Release integrity

# Vaktar att autouppdateringen aldrig försvinner ur den publicerade
# versionen igen: uppdaterarfiler, Hjälp-menyns "Sök ny version",
# tray-valet, auto-kollen vid start och release-manifestet testas
# vid varje push och tagg.

on:
  push:
    branches:
      - "arena/**"
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  updater-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Guard the auto-updater
        run: >-
          python -m pytest
          tests/test_updater.py
          tests/test_release_integrity.py
          -q

  windows-autostart:
    name: Windows autostart (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Test Windows startup, shortcuts and package updates
        shell: pwsh
        run: |
          python -m pytest tests/test_windows_shortcut_logic.py tests/test_windows_shortcut_native.py tests/test_autostart_settings.py tests/test_start_launcher_windows.py tests/test_startup_errors.py tests/test_python_update_scheduler.py -q --junitxml=windows-autostart-results.xml
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            if (Test-Path windows-autostart-results.xml) {
              [xml]$report = Get-Content windows-autostart-results.xml -Raw
              foreach ($case in $report.SelectNodes('//testcase[failure or error]')) {
                $failure = $case.SelectSingleNode('failure|error')
                $detail = ("$($case.name): $($failure.InnerText)")
                if ($detail.Length -gt 15000) { $detail = $detail.Substring(0,15000) }
                $detail = $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                $file = if ($case.classname -match 'test_autostart_settings') {
                  'tests/test_autostart_settings.py'
                } elseif ($case.classname -match 'test_start_launcher_windows') {
                  'tests/test_start_launcher_windows.py'
                } elseif ($case.classname -match 'test_startup_errors') {
                  'tests/test_startup_errors.py'
                } elseif ($case.classname -match 'test_python_update_scheduler') {
                  'tests/test_python_update_scheduler.py'
                } elseif ($case.classname -match 'test_windows_shortcut_logic') {
                  'tests/test_windows_shortcut_logic.py'
                } else { 'tests/test_windows_shortcut_native.py' }
                Write-Output "::error file=$file,title=Windows autostart::$detail"
              }
            } else {
              Write-Output "::error::Windows autostart test exited $code without a test report"
            }
            exit $code
          }

  autostart-ui:
    name: Autostart and tray UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offscreen Qt and pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3
          python -m pip install -q pytest PySide6-Essentials qrcode
      - name: Test autostart and tray status
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m pytest tests/test_autostart_ui_status.py tests/test_tray_minimize.py tests/test_tray_behaviour_menu.py tests/test_start_minimized.py tests/test_donate_swish_qr.py tests/test_views_i18n_donate.py -q --junitxml=autostart-ui-results.xml > autostart-ui.log 2>&1
          code=$?
          cat autostart-ui.log
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = 'autostart-ui-results.xml'
          if os.path.isfile(path):
              report = ET.parse(path)
              failures = [(case, issue) for case in report.iter('testcase')
                          for issue in case if issue.tag in ('error', 'failure')]
              for case, issue in failures:
                  text = (case.get('name', '') + ': ' + (issue.text or ''))[:15000]
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Autostart UI::' + text)
          else:
              with open('autostart-ui.log', encoding='utf-8', errors='replace') as log:
                  text = log.read()[-15000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Autostart UI::' + text)
          PY
          fi
          exit "$code"

  unix-startup:
    name: Start files (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Test startup without installing Python
        run: >-
          python -m pytest
          tests/test_start_launcher_unix.py
          tests/test_startup_errors.py
          tests/test_python_runtime_fallback.py
          tests/test_python_update_scheduler.py
          -q

  build-release-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [updater-guard, windows-autostart, autostart-ui, unix-startup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the versioned program package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_PATH="${RUNNER_TEMP}/InvoiceBundle-v${VERSION}.zip"
          python build_release.py \
            --root . \
            --out "$PACKAGE_PATH" \
            --version "$VERSION" \
            --sha "$(git rev-parse HEAD)"
      - name: Verifiera tryckfilerna i paketet
        run: |
          PACKAGE_PATH="${RUNNER_TEMP}/InvoiceBundle-v${GITHUB_REF_NAME#v}.zip"
          python - "$PACKAGE_PATH" <<'PY'
          import json, sys, zipfile

          required = [
              "brand/README.md",
              "brand/fakturabunten-ikon.svg",
              "brand/fakturabunten-ikon-monokrom.svg",
              "brand/fakturabunten-ikon-tryck-bleed.svg",
              "brand/fakturabunten-logotyp.svg",
              "brand/fakturabunten-logotyp-mork-bakgrund.svg",
              "brand/fakturabunten-logotyp-svartvit.svg",
          ]
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = set(zf.namelist())
              listed = set(
                  json.loads(zf.read("build_info.json").decode("utf-8"))["files"]
              )
          missing = [rel for rel in required if rel not in names or rel not in listed]
          print("Tryckfiler i release-paketet:", len(required) - len(missing),
                "av", len(required))
          for rel in required:
              print(f"  {'OK  ' if rel not in missing else 'SAKNAS'} {rel}")
          if missing:
              print("Tryckfilerna måste ligga i programpaketet:", missing)
              sys.exit(1)
          PY

      - name: Attach package to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "${RUNNER_TEMP}/InvoiceBundle-v${VERSION}.zip" \
            --clobber
