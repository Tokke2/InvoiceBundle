name: Release integrity

# Vaktar att autouppdateringen aldrig försvinner ur den publicerade
# versionen igen: uppdaterarfiler, Hjälp-menyns "Sök ny version",
# tray-valet, auto-kollen vid start och release-manifestet testas
# vid varje push och tagg.

on:
  push:
    branches:
      - "arena/**"
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  updater-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Guard the auto-updater
        run: >-
          python -m pytest
          tests/test_updater.py
          tests/test_release_integrity.py
          -q

  build-release-package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the versioned program package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_PATH="${RUNNER_TEMP}/InvoiceBundle-v${VERSION}.zip"
          python build_release.py \
            --root . \
            --out "$PACKAGE_PATH" \
            --version "$VERSION" \
            --sha "$(git rev-parse HEAD)"
      - name: Verifiera tryckfilerna i paketet
        run: |
          PACKAGE_PATH="${RUNNER_TEMP}/InvoiceBundle-v${GITHUB_REF_NAME#v}.zip"
          python - "$PACKAGE_PATH" <<'PY'
          import json, sys, zipfile

          required = [
              "brand/README.md",
              "brand/fakturabunten-ikon.svg",
              "brand/fakturabunten-ikon-monokrom.svg",
              "brand/fakturabunten-ikon-tryck-bleed.svg",
              "brand/fakturabunten-logotyp.svg",
              "brand/fakturabunten-logotyp-mork-bakgrund.svg",
              "brand/fakturabunten-logotyp-svartvit.svg",
          ]
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = set(zf.namelist())
              listed = set(
                  json.loads(zf.read("build_info.json").decode("utf-8"))["files"]
              )
          missing = [rel for rel in required if rel not in names or rel not in listed]
          print("Tryckfiler i release-paketet:", len(required) - len(missing),
                "av", len(required))
          for rel in required:
              print(f"  {'OK  ' if rel not in missing else 'SAKNAS'} {rel}")
          if missing:
              print("Tryckfilerna måste ligga i programpaketet:", missing)
              sys.exit(1)
          PY

      - name: Attach package to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "${RUNNER_TEMP}/InvoiceBundle-v${VERSION}.zip" \
            --clobber
