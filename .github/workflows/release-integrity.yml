name: Release integrity

# Vaktar att autouppdateringen aldrig försvinner ur den publicerade
# versionen igen: uppdaterarfiler, Hjälp-menyns "Sök ny version",
# tray-valet, auto-kollen vid start och release-manifestet testas
# vid varje push och tagg.

on:
  push:
    branches:
      - "arena/**"
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  updater-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Guard the auto-updater
        run: >-
          python -m pytest
          tests/test_updater.py
          tests/test_release_integrity.py
          -q

  windows-autostart:
    name: Windows autostart (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Test Windows startup, shortcuts and package updates
        shell: pwsh
        run: |
          python -m pytest tests/test_windows_shortcut_logic.py tests/test_windows_shortcut_native.py tests/test_autostart_settings.py tests/test_start_launcher_windows.py tests/test_startup_errors.py tests/test_python_update_scheduler.py -q --junitxml=windows-autostart-results.xml
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            if (Test-Path windows-autostart-results.xml) {
              [xml]$report = Get-Content windows-autostart-results.xml -Raw
              foreach ($case in $report.SelectNodes('//testcase[failure or error]')) {
                $failure = $case.SelectSingleNode('failure|error')
                $detail = ("$($case.name): $($failure.InnerText)")
                if ($detail.Length -gt 15000) { $detail = $detail.Substring(0,15000) }
                $detail = $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                $file = if ($case.classname -match 'test_autostart_settings') {
                  'tests/test_autostart_settings.py'
                } elseif ($case.classname -match 'test_start_launcher_windows') {
                  'tests/test_start_launcher_windows.py'
                } elseif ($case.classname -match 'test_startup_errors') {
                  'tests/test_startup_errors.py'
                } elseif ($case.classname -match 'test_python_update_scheduler') {
                  'tests/test_python_update_scheduler.py'
                } elseif ($case.classname -match 'test_windows_shortcut_logic') {
                  'tests/test_windows_shortcut_logic.py'
                } else { 'tests/test_windows_shortcut_native.py' }
                Write-Output "::error file=$file,title=Windows autostart::$detail"
              }
            } else {
              Write-Output "::error::Windows autostart test exited $code without a test report"
            }
            exit $code
          }

  autostart-ui:
    name: Autostart and tray UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offscreen Qt and pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3
          python -m pip install -q pytest PySide6-Essentials qrcode
      - name: Test autostart and tray status
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m pytest tests/test_autostart_ui_status.py tests/test_tray_minimize.py tests/test_tray_behaviour_menu.py tests/test_start_minimized.py tests/test_donate_swish_qr.py tests/test_views_i18n_donate.py -q --junitxml=autostart-ui-results.xml > autostart-ui.log 2>&1
          code=$?
          cat autostart-ui.log
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = 'autostart-ui-results.xml'
          if os.path.isfile(path):
              report = ET.parse(path)
              failures = [(case, issue) for case in report.iter('testcase')
                          for issue in case if issue.tag in ('error', 'failure')]
              for case, issue in failures:
                  text = (case.get('name', '') + ': ' + (issue.text or ''))[:15000]
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Autostart UI::' + text)
          else:
              with open('autostart-ui.log', encoding='utf-8', errors='replace') as log:
                  text = log.read()[-15000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Autostart UI::' + text)
          PY
          fi
          exit "$code"

  unix-startup:
    name: Start files (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Test startup without installing Python
        run: >-
          python -m pytest
          tests/test_start_launcher_unix.py
          tests/test_startup_errors.py
          tests/test_python_runtime_fallback.py
          tests/test_python_update_scheduler.py
          -q

  build-release-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [updater-guard, windows-autostart, autostart-ui, unix-startup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      asset_sha256: ${{ steps.package_meta.outputs.sha256 }}
      asset_size: ${{ steps.package_meta.outputs.size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the versioned program package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_PATH="${RUNNER_TEMP}/InvoiceBundle-v${VERSION}.zip"
          python build_release.py \
            --root . \
            --out "$PACKAGE_PATH" \
            --version "$VERSION" \
            --sha "$(git rev-parse HEAD)"
      - name: Verifiera tryckfilerna i paketet
        run: |
          PACKAGE_PATH="${RUNNER_TEMP}/InvoiceBundle-v${GITHUB_REF_NAME#v}.zip"
          python - "$PACKAGE_PATH" <<'PY'
          import json, sys, zipfile

          required = [
              "brand/README.md",
              "brand/fakturabunten-ikon.svg",
              "brand/fakturabunten-ikon-monokrom.svg",
              "brand/fakturabunten-ikon-tryck-bleed.svg",
              "brand/fakturabunten-logotyp.svg",
              "brand/fakturabunten-logotyp-mork-bakgrund.svg",
              "brand/fakturabunten-logotyp-svartvit.svg",
          ]
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = set(zf.namelist())
              listed = set(
                  json.loads(zf.read("build_info.json").decode("utf-8"))["files"]
              )
          missing = [rel for rel in required if rel not in names or rel not in listed]
          print("Tryckfiler i release-paketet:", len(required) - len(missing),
                "av", len(required))
          for rel in required:
              print(f"  {'OK  ' if rel not in missing else 'SAKNAS'} {rel}")
          if missing:
              print("Tryckfilerna måste ligga i programpaketet:", missing)
              sys.exit(1)
          PY

      - name: Verify built package & record checksum
        id: package_meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_PATH="${RUNNER_TEMP}/InvoiceBundle-v${VERSION}.zip"
          python build_release.py \
            --verify "$PACKAGE_PATH" \
            --version "$VERSION" \
            --sha "$(git rev-parse HEAD)"
          python - "$PACKAGE_PATH" "$GITHUB_OUTPUT" <<'PY'
          import pathlib, sys
          from build_release import sha256_file

          pkg = pathlib.Path(sys.argv[1])
          out_file = pathlib.Path(sys.argv[2])
          with out_file.open("a", encoding="utf-8") as fh:
              fh.write(f"sha256={sha256_file(pkg)}\n")
              fh.write(f"size={pkg.stat().st_size}\n")
          PY

      - name: Attach package to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "${RUNNER_TEMP}/InvoiceBundle-v${VERSION}.zip" \
            --clobber

  verify-live-release:
    name: Verify live release package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-release-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release job, tag commit & live downloaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ needs.build-release-package.outputs.asset_sha256 }}
          EXPECTED_SIZE: ${{ needs.build-release-package.outputs.asset_size }}
          BUILD_JOB_RESULT: ${{ needs.build-release-package.result }}
        run: |
          set -euo pipefail
          if [ "$BUILD_JOB_RESULT" != "success" ]; then
            echo "::error::build-release-package did not succeed ($BUILD_JOB_RESULT)"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_NAME="InvoiceBundle-v${VERSION}.zip"
          LIVE_ZIP="${RUNNER_TEMP}/live-${ASSET_NAME}"

          # 1. Verify all preceding jobs in this workflow run succeeded
          JOBS_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=50")
          python - "$JOBS_JSON" <<'PY'
          import json, sys

          jobs = json.loads(sys.argv[1]).get("jobs", [])
          by_name = {j["name"]: j for j in jobs}
          required = {
              "updater-guard",
              "Windows autostart (Python 3.11)",
              "Windows autostart (Python 3.15)",
              "Autostart and tray UI",
              "Start files (ubuntu-latest)",
              "Start files (macos-latest)",
              "build-release-package",
          }
          missing_jobs = sorted(required - set(by_name))
          failed = [
              f"{name} ({by_name[name]['status']}/{by_name[name]['conclusion']})"
              for name in sorted(required & set(by_name))
              if by_name[name]["status"] != "completed"
              or by_name[name]["conclusion"] != "success"
          ]
          other_bad = [
              f"{j['name']} ({j['status']}/{j['conclusion']})"
              for j in jobs
              if j.get("conclusion") in ("failure", "cancelled", "timed_out")
          ]
          print("Preceding required jobs checked:", len(required))
          if missing_jobs or failed or other_bad:
              details = []
              if missing_jobs:
                  details.append("missing=" + ", ".join(missing_jobs))
              if failed:
                  details.append("not-success=" + ", ".join(failed))
              if other_bad:
                  details.append("bad=" + ", ".join(other_bad))
              print("::error::Release workflow check failed: " + "; ".join(details))
              sys.exit(1)
          PY

          # 2. Verify live tag ref points to this exact commit SHA
          TAG_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          python - "$TAG_JSON" "$GITHUB_SHA" "$GITHUB_REPOSITORY" <<'PY'
          import json, subprocess, sys

          obj = json.loads(sys.argv[1])["object"]
          expected_sha = sys.argv[2]
          repo = sys.argv[3]
          resolved = obj["sha"]
          if obj.get("type") == "tag":
              out = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/git/tags/{resolved}"],
                  text=True,
              )
              resolved = json.loads(out)["object"]["sha"]
          print(f"Live tag commit SHA: {resolved} (expected: {expected_sha})")
          if resolved != expected_sha:
              print(f"::error::Tag commit mismatch: {resolved} != {expected_sha}")
              sys.exit(1)
          PY

          # 3. Verify live GitHub Release exists, is published, and has the asset
          REL_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          python - "$REL_JSON" "$ASSET_NAME" "$EXPECTED_SIZE" <<'PY'
          import json, sys

          rel = json.loads(sys.argv[1])
          asset_name = sys.argv[2]
          expected_size = int(sys.argv[3])
          if rel.get("draft"):
              print("::error::Release is still marked as draft")
              sys.exit(1)
          matches = [a for a in rel.get("assets", []) if a["name"] == asset_name]
          if not matches:
              print(f"::error::Asset {asset_name} missing from live release")
              sys.exit(1)
          asset = matches[0]
          print(f"Live asset: {asset['name']} ({asset['size']} bytes, updated {asset['updated_at']})")
          if int(asset["size"]) != expected_size:
              print(f"::error::Live asset size mismatch: {asset['size']} != {expected_size}")
              sys.exit(1)
          PY

          # 4. Download the actual live release asset and verify CRC, SHA-256, build_info.json & files
          for attempt in 1 2 3; do
            if gh release download "$GITHUB_REF_NAME" -p "$ASSET_NAME" -O "$LIVE_ZIP" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to download live release asset $ASSET_NAME"
              exit 1
            fi
            sleep 3
          done

          python build_release.py \
            --verify "$LIVE_ZIP" \
            --version "$VERSION" \
            --sha "$GITHUB_SHA" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --expected-size "$EXPECTED_SIZE"

          {
            echo "### Live Release Verification Passed"
            echo "- Tag: \`${GITHUB_REF_NAME}\` -> \`${GITHUB_SHA}\`"
            echo "- Asset: \`${ASSET_NAME}\` (${EXPECTED_SIZE} bytes)"
            echo "- SHA-256: \`${EXPECTED_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-release-build:
    name: Verify release build & live release status
    if: "!startsWith(github.ref, 'refs/tags/v')"
    needs: [updater-guard, windows-autostart, autostart-ui, unix-startup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and verify dry-run release package
        run: |
          DRYRUN_ZIP="${RUNNER_TEMP}/InvoiceBundle-dryrun.zip"
          python build_release.py \
            --root . \
            --out "$DRYRUN_ZIP" \
            --version "1.0.0" \
            --sha "$GITHUB_SHA"
          python build_release.py \
            --verify "$DRYRUN_ZIP" \
            --version "1.0.0" \
            --sha "$GITHUB_SHA"
      - name: Verify live release & tag release workflow status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time

          repo = os.environ["GITHUB_REPOSITORY"]
          head_sha = os.environ["GITHUB_SHA"]

          def gh_json(endpoint: str):
              res = subprocess.run(
                  ["gh", "api", endpoint],
                  capture_output=True, text=True, timeout=30,
              )
              if res.returncode != 0:
                  return None, (res.stderr or res.stdout or "").strip()
              return json.loads(res.stdout), ""

          def get_tag_runs():
              data, err = gh_json(
                  f"repos/{repo}/actions/workflows/release-integrity.yml/runs?event=push&per_page=30"
              )
              if data is None:
                  return None, err
              return [
                  r for r in data.get("workflow_runs", [])
                  if str(r.get("head_branch", "")).startswith("v")
              ], ""

          tag_runs, err = get_tag_runs()
          if tag_runs is None:
              print(f"Skipping remote run check (API unavailable): {err}")
              sys.exit(0)

          # If a tag release run exists for THIS commit SHA, wait for it to finish
          matching = [r for r in tag_runs if r.get("head_sha") == head_sha]
          target_run = None
          if matching:
              target_run = matching[0]
              deadline = time.monotonic() + 180
              while (
                  target_run.get("status") != "completed"
                  and time.monotonic() < deadline
              ):
                  print(
                      f"Waiting for tag release run #{target_run['id']} "
                      f"({target_run['head_branch']} @ {head_sha[:8]}) -> "
                      f"{target_run.get('status')}..."
                  )
                  time.sleep(10)
                  refreshed, _ = get_tag_runs()
                  if refreshed:
                      m = [r for r in refreshed if r.get("id") == target_run["id"]]
                      if m:
                          target_run = m[0]
          else:
              completed = [r for r in tag_runs if r.get("status") == "completed"]
              if not completed:
                  print("No completed tag release runs yet on this repository.")
                  sys.exit(0)
              target_run = completed[0]

          print(
              f"Checking tag release run #{target_run['id']} "
              f"({target_run['head_branch']} @ {target_run['head_sha'][:8]}): "
              f"status={target_run.get('status')}, conclusion={target_run.get('conclusion')}"
          )
          jobs_data, err = gh_json(
              f"repos/{repo}/actions/runs/{target_run['id']}/jobs?per_page=50"
          )
          if jobs_data is None:
              print(f"::error::Could not inspect jobs of release run {target_run['id']}: {err}")
              sys.exit(1)

          if target_run.get("status") == "completed":
              if target_run.get("conclusion") != "success":
                  print(
                      f"::error::Release workflow {target_run['id']} "
                      f"({target_run['head_branch']}) ended with conclusion="
                      f"{target_run.get('conclusion')!r} ({target_run.get('html_url')})"
                  )
                  sys.exit(1)
              pkg_jobs = [
                  j for j in jobs_data.get("jobs", [])
                  if j.get("name") in ("build-release-package", "Verify live release package")
              ]
              if not pkg_jobs:
                  print(f"::error::Release run {target_run['id']} did not execute release jobs")
                  sys.exit(1)
              for j in pkg_jobs:
                  print(f"  {j['name']}: {j['conclusion']}")
                  if j.get("conclusion") != "success":
                      print(f"::error::Release job {j['name']} failed in run {target_run['id']}")
                      sys.exit(1)
          else:
              bad = [
                  f"{j['name']} ({j.get('conclusion')})"
                  for j in jobs_data.get("jobs", [])
                  if j.get("conclusion") in ("failure", "cancelled", "timed_out")
              ]
              if bad:
                  print(f"::error::Active release run {target_run['id']} already has failed jobs: " + ", ".join(bad))
                  sys.exit(1)
              print(f"Active tag release run #{target_run['id']} is still healthy ({target_run.get('status')}).")

          releases_data, err = gh_json(f"repos/{repo}/releases?per_page=10")
          if releases_data:
              published = [r for r in releases_data if not r.get("draft")]
              for rel in published[:3]:
                  tag = rel["tag_name"]
                  expected_asset = f"InvoiceBundle-{tag}.zip"
                  assets = [a for a in rel.get("assets", []) if a["name"] == expected_asset]
                  if not assets or int(assets[0].get("size", 0)) <= 0:
                      print(f"::error::Live release {tag} is missing non-empty {expected_asset}")
                      sys.exit(1)
                  print(f"Live release {tag}: {expected_asset} ({assets[0]['size']} bytes)")
          PY

  publish-latest-release:
    name: Publish rolling latest release
    # HÅRD REGEL: varje kodförändring (push till arbetsbranch/main)
    # uppdaterar releasen och markerar den som "latest" så att appens
    # uppdaterare (sha-jämförelse mot build_info.json) alltid hittar
    # den senaste koden. Rör aldrig v*-taggarna; taggen "latest" pekar
    # alltid på den nya commiten. Ingen loop: on.push.tags godtar bara v*.
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.ref, 'refs/tags/v')
    needs: [updater-guard, windows-autostart, autostart-ui, unix-startup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the rolling latest package
        run: |
          PACKAGE_PATH="${RUNNER_TEMP}/InvoiceBundle-latest.zip"
          python build_release.py \
            --root . \
            --out "$PACKAGE_PATH" \
            --version "1.0.0" \
            --sha "$GITHUB_SHA"
          python build_release.py \
            --verify "$PACKAGE_PATH" \
            --version "1.0.0" \
            --sha "$GITHUB_SHA"
      - name: Point the latest tag at this commit
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
      - name: Publish & mark the release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --latest \
              --title "Fakturabunten — senaste build (latest)" \
              --notes "Automatisk rullande release av commit ${GITHUB_SHA}. Appen hittar den via Sök ny version — sha jämförs mot build_info.json."
          else
            gh release create latest \
              "$RUNNER_TEMP/InvoiceBundle-latest.zip#InvoiceBundle-latest.zip" \
              --latest \
              --title "Fakturabunten — senaste build (latest)" \
              --notes "Automatisk rullande release av commit ${GITHUB_SHA}. Appen hittar den via Sök ny version — sha jämförs mot build_info.json."
          fi
          gh release upload latest \
            "$RUNNER_TEMP/InvoiceBundle-latest.zip" --clobber
          gh release edit latest --latest
      - name: Verify latest points at this commit with this package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest")
          python - "$TAG_JSON" "$GITHUB_SHA" "$GITHUB_REPOSITORY" <<'PY'
          import json, subprocess, sys

          obj = json.loads(sys.argv[1])["object"]
          expected = sys.argv[2]
          repo = sys.argv[3]
          resolved = obj["sha"]
          if obj.get("type") == "tag":
              out = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/git/tags/{resolved}"],
                  text=True,
              )
              resolved = json.loads(out)["object"]["sha"]
          assert resolved == expected, f"{resolved} != {expected}"
          print(f"latest -> {resolved} (OK)")
          PY
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq .tag_name)
          if [ "$LATEST" != "latest" ]; then
            echo "::error::releases/latest pekar på $LATEST, inte latest"
            exit 1
          fi
          ASSET_SIZE=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/latest" \
            --jq '.assets[] | select(.name=="InvoiceBundle-latest.zip") | .size')
          if [ "${ASSET_SIZE:-0}" -le 0 ]; then
            echo "::error::Asset InvoiceBundle-latest.zip saknas/tom"
            exit 1
          fi
          echo "### Rolling latest published" >> "$GITHUB_STEP_SUMMARY"
          echo "- latest -> ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Asset: InvoiceBundle-latest.zip (${ASSET_SIZE} bytes)" >> "$GITHUB_STEP_SUMMARY"
